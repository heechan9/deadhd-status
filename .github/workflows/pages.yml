name: Build status pages

on:
  schedule:
    - cron: '23 * * * *'   # 매시 23분(UTC). GitHub 사정에 따라 늦게 시작될 수 있다.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check review tracking
        run: python scripts/test_build.py
      - name: Build pages from public GitHub records
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
